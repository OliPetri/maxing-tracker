plugins { id 'java' }
repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}
group = 'com.maxingtime'
version = '0.8.0'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.maxingtime.MaxingTimePluginTest'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

test {
    systemProperty 'java.awt.headless', 'true'
}
